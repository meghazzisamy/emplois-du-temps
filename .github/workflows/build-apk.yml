name: Construire l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Installer les dépendances
        run: npm ci

      - name: Préparer la page et synchroniser Android
        run: |
          npm run build:web
          npx cap sync android

      - name: Construire l'APK signé
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/EmploiDuTemps-v1.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: EmploiDuTemps-v1.${{ github.run_number }}
          path: dist/*.apk

      - name: Publier la version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Emploi du temps v1.${{ github.run_number }}
          body: |
            📱 Version 1.${{ github.run_number }}
            ${{ github.event.head_commit.message }}

            Installation : télécharge le fichier .apk ci-dessous sur ton téléphone, ouvre-le, puis « Installer » (ou « Mettre à jour »).
          files: dist/*.apk
          make_latest: true
